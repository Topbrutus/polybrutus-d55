name: Verify Polybrutus D55 exact science and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d55:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational dependencies
        run: python -m pip install sympy==1.14.0
      - name: Primary exact metric, parent and ideal graph
        run: python src/verify_d55.py
      - name: Independent Fraction labelled-distance verification
        run: python tests/independent_d55.py
      - name: Exact deterministic certificate unchanged
        run: git diff --exit-code -- results/certificate_d55.json
      - name: Validate D55 keywords, structured parent DOI and bibliography
        run: python src/check_zenodo_metadata.py
